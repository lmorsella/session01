[project]
name = "backend"
version = "0.1.0"
description = "FastAPI JWT backend"
authors = [
    {name = "session01",email = "noreply@example.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
